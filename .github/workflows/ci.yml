name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (サーバーテストが合成音声の生成・分割に使用)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build for GitHub Pages (サブパス配信)
        run: npm run build -w @app/web -- --outDir /tmp/pages-dist --emptyOutDir
        env:
          VITE_BASE: /soundcore-transcript-pwa/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t soundcore-transcript-pwa .
